[project]
name = "mcp-server-docker"
version = "0.3.0+x1pher.1"
description = "Community-maintained Docker MCP server with safer container recreation and bounded output"
readme = "README.md"
dependencies = [
    "docker>=7.1.0",
    "mcp>=2,<3",
    "pydantic>=2.12",
]
license = { file = "LICENSE" }
keywords = ["docker", "mcp", "server"]

requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/X1pheR/mcp-server-docker"
Documentation = "https://github.com/X1pheR/mcp-server-docker#readme"
Issues = "https://github.com/X1pheR/mcp-server-docker/issues"
Upstream = "https://github.com/ckreiling/mcp-server-docker"

[[project.authors]]
name = "Christian Kreiling"
email = "kreiling@hey.com"

[[project.maintainers]]
name = "X1pheR"

[dependency-groups]
dev = [
    "mcp[cli]>=2,<3",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-server-docker = "mcp_server_docker:main"

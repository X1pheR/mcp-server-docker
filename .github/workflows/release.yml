name: Release

on:
  push:
    tags:
      - "v*-x1pher.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character release source commit SHA"
        required: true
        type: string

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.12"
      - name: Verify tag, source and tests
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = "false"
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${version/+/-}"
          test "${RELEASE_TAG}" = "${expected_tag}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-list -n1 "${RELEASE_TAG}")" = "${EXPECTED_SHA}"
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${EXPECTED_SHA}" = "$(git rev-parse origin/main)"
          else
            git merge-base --is-ancestor "${EXPECTED_SHA}" origin/main
          fi
          uv sync --frozen --all-groups
          uv run --frozen pytest -q
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests
      - name: Build reproducible release assets
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --wheel --out-dir dist-a
          uv build --wheel --out-dir dist-b
          for artifact in dist-a/*.whl; do
            cmp "$artifact" "dist-b/$(basename "$artifact")"
          done
          mv dist-a dist
          rm -rf dist-b
          sha256sum dist/*.whl | sed 's#  dist/#  #' > SHA256SUMS
      - name: Attest release artifact
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Prepare provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${ATTESTATION_BUNDLE}"
          cp "${ATTESTATION_BUNDLE}" "mcp-server-docker-${RELEASE_TAG}.sigstore.json"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --draft \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            dist/*.whl \
            SHA256SUMS \
            "mcp-server-docker-${RELEASE_TAG}.sigstore.json"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false

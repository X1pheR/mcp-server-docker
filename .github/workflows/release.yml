name: Release

on:
  push:
    tags:
      - "v*-x1pher.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.12"
      - name: Verify tag, source and tests
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${version/+/-}"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          uv sync --frozen --all-groups
          uv run --frozen pytest -q
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests
      - name: Build reproducible release assets
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --wheel --out-dir dist-a
          uv build --wheel --out-dir dist-b
          for artifact in dist-a/*.whl; do
            cmp "$artifact" "dist-b/$(basename "$artifact")"
          done
          mv dist-a dist
          rm -rf dist-b
          sha256sum dist/*.whl | sed 's#  dist/#  #' > SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.whl \
            SHA256SUMS
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false
